[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/codecoradev/titen"
description = "Self-hosted Threads management platform"

[workspace.dependencies]
titen-core = { path = "crates/titen-core" }
titen-api = { path = "crates/titen-api" }

# HTTP
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tower = "0.5"

# CLI
clap = { version = "4", features = ["derive"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client (Threads API)
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# IDs
uuid = { version = "1", features = ["v7", "serde"] }

# Scheduler
tokio-cron-scheduler = "0.13"

# Security
subtle = "2.6"

# Encryption (AES-256-GCM for token at-rest encryption)
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
hex = "0.4"
