# Titen Docker Compose — standalone (API + Web + reverse proxy).
# Single origin on http://localhost:7845 (Caddy routes /api and /health to API,
# everything else to the SvelteKit web UI).
#
# Usage:
#   cp .env.example .env   # then edit if needed
#   docker compose up -d --build
#
# Production: set TITEN_API_KEY in .env to lock down the API.
# Public exposure: put your own TLS-terminating proxy (Caddy/nginx) in front,
# or replace this Caddyfile block with a domain + auto_https.

services:
  titen:
    build:
      context: .
      dockerfile: Dockerfile
    image: titen-api:local
    container_name: titen-api
    volumes:
      - titen-data:/data
    environment:
      - TITEN_API_KEY=${TITEN_API_KEY:-}
      - TITEN_HOST=0.0.0.0
      - TITEN_PORT=7845
      - RUST_LOG=${RUST_LOG:-info}
      # Optional integrations (leave blank to disable):
      - TITEN_SENTIMENT_ENGINE=${TITEN_SENTIMENT_ENGINE:-stub}
      - TITEN_S3_ENDPOINT=${TITEN_S3_ENDPOINT:-}
      - TITEN_S3_BUCKET=${TITEN_S3_BUCKET:-}
      - TITEN_S3_REGION=${TITEN_S3_REGION:-us-east-1}
      - TITEN_S3_ACCESS_KEY=${TITEN_S3_ACCESS_KEY:-}
      - TITEN_S3_SECRET_KEY=${TITEN_S3_SECRET_KEY:-}
      - TITEN_S3_PUBLIC_URL=${TITEN_S3_PUBLIC_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7845/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: titen-web:local
    container_name: titen-web
    depends_on:
      - titen
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: titen-proxy
    depends_on:
      - titen
      - web
    ports:
      - "${TITEN_PROXY_PORT:-7845}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  titen-data:
  caddy-data:
  caddy-config:
