# Titen Docker Compose — two-container architecture:
#   - web: SvelteKit SSR server (Bun + adapter-node) — serves pages + proxies /api
#   - api: Rust Axum backend — Threads management API
#
# Usage:
#   docker compose up --build          # local build
#   docker compose up                  # pull prebuilt images

services:
  web:
    image: ghcr.io/codecoradev/titen-web:${TITEN_TAG:-develop}
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: titen-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - ORIGIN=${APP_URL:-http://localhost:3000}
      - API_INTERNAL=http://api:7845
    depends_on:
      - api

  api:
    image: ghcr.io/codecoradev/titen-api:${TITEN_TAG:-develop}
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: titen-api
    restart: unless-stopped
    # API is NOT exposed to the host — only accessible from
    # the web container via Docker internal network.
    expose:
      - "7845"
    volumes:
      - titen-data:/data
    environment:
      - TITEN_API_KEY=${TITEN_API_KEY:-}
      - RUST_LOG=${RUST_LOG:-titen_api=info,tower_http=info}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7845/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  titen-data:
