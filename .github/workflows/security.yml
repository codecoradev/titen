name: Security

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  cargo-audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        # Ignored advisories (with justification):
        #   RUSTSEC-2024-0436: paste unmaintained — informational, no vulnerability
        #   RUSTSEC-2023-0071: rsa Marvin Attack — transitive dep via reqwest/hyper,
        #     no fixed upgrade available. Not used in server-facing crypto paths.
        run: cargo audit --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2023-0071

  trivy:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
