name: Bug report
description: Report a bug in Titen
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill out the sections below so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to trigger the behavior.
      value: |
        1. Run `titen ...`
        2. ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Error output, stack traces, or server logs. Paste in a code block.
      render: shell

  - type: input
    id: version
    attributes:
      label: Titen version
      placeholder: "v0.2.0"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API server (titen-api)
        - Core library (titen-core)
        - CLI (titen-cli)
        - MCP server (titen-mcp)
        - Frontend (web/)
        - Docker / deployment
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "Ubuntu 22.04, macOS 14, etc."

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else relevant. Configuration details, workaround attempts, etc.
