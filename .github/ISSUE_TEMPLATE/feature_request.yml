name: Feature request
description: Suggest a feature for Titen
title: "[FEATURE] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, check open issues to make sure it hasn't been discussed already.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? Who runs into it?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you'd like Titen to do.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about or tried.

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API server (titen-api)
        - Core library (titen-core)
        - CLI (titen-cli)
        - MCP server (titen-mcp)
        - Frontend (web/)
        - Docker / deployment
        - Other

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, mockups, links, or examples that help explain the idea.
